<div class="flex min-h-screen items-center justify-center bg-gray-50 p-4">
  <mat-card class="w-full max-w-sm">
    <mat-card-header>
      <mat-card-title>Bem-vindo</mat-card-title>
    </mat-card-header>

    <mat-card-content class="pt-2">
      @if (loading()) {
        <p class="text-sm text-gray-600">Carregando...</p>
      } @else if (tenant(); as t) {
        <p class="text-sm text-gray-700">Tenant ativo:</p>
        <p class="text-lg font-semibold">{{ t.name }}</p>
        <p class="text-sm text-gray-500">{{ t.slug }} · {{ t.status }}</p>
      } @else {
        <p class="text-sm text-red-600">Não foi possível carregar o tenant atual.</p>
      }
    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="logout()">Sair</button>
    </mat-card-actions>
  </mat-card>
</div>
