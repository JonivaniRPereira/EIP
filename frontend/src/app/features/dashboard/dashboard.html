<div class="mx-auto max-w-2xl">
  <h1 class="mb-4 text-2xl font-semibold text-gray-900">Bem-vindo</h1>

  <mat-card>
    <mat-card-content class="pt-4">
      @if (loading()) {
        <p class="text-sm text-gray-600">Carregando...</p>
      } @else if (tenant(); as t) {
        <p class="text-sm text-gray-700">Tenant ativo:</p>
        <p class="text-lg font-semibold">{{ t.name }}</p>
        <p class="text-sm text-gray-500">{{ t.slug }} · {{ t.status }}</p>
      } @else {
        <p class="text-sm text-red-600">Não foi possível carregar o tenant atual.</p>
      }
    </mat-card-content>
  </mat-card>
</div>
