<div class="auth-page flex items-center justify-center p-6">
  <mat-card class="w-full max-w-sm">
    <img
      class="auth-brand"
      src="brand/jp-code-craft-logo.png"
      width="192"
      height="64"
      alt="JP Code Craft Solutions"
    />
    <mat-card-header>
      <mat-card-title>Selecione a organização</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      @if (errorMessage(); as message) {
        <p class="text-sm text-red-600 pb-2">{{ message }}</p>
      }

      @if (tenants().length === 0) {
        <p class="text-sm text-gray-600 pb-2">Você ainda não pertence a nenhuma organização.</p>
        <a mat-flat-button color="primary" routerLink="/create-tenant">Criar organização</a>
      } @else {
        <mat-nav-list>
          @for (tenant of tenants(); track tenant.tenantId) {
            <a
              mat-list-item
              (click)="choose(tenant.tenantId)"
              [class.opacity-50]="submittingTenantId() !== null"
            >
              <span matListItemTitle>{{ tenant.tenantName }}</span>
              <span matListItemLine>{{ tenant.tenantSlug }}</span>
            </a>
          }
        </mat-nav-list>
      }
    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="logout()">Sair</button>
    </mat-card-actions>
  </mat-card>
</div>
